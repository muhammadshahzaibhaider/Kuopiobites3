name: Payment integrity
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'supabase/migrations/**'
      - 'next.config.mjs'
      - '.github/workflows/payment-integrity.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: kuopio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kuopio_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ALLOW_TEST_DATABASE_RESET: '1'
      TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/kuopio_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Prepare migration scaffold
        shell: bash
        run: |
          if ! compgen -G 'supabase/migrations/*_stripe_checkout_integrity.sql' >/dev/null; then
            npx --yes supabase@3.4.0 --help >/dev/null
            npx --yes supabase@3.4.0 migration --help >/dev/null
            npx --yes supabase@3.4.0 migration new --help >/dev/null
            npx --yes supabase@3.4.0 migration new stripe_checkout_integrity
            for migration_path in supabase/migrations/*_stripe_checkout_integrity.sql; do
              echo "MIGRATION_PATH=$migration_path"
            done
          fi
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Backend regression suite
        working-directory: backend
        run: npm test
      - name: TypeScript compilation
        working-directory: backend
        run: npx tsc --noEmit
      - name: Acceptance estimate regression tests
        working-directory: frontend
        run: node --experimental-strip-types --test src/admin/accept-order.test.mjs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean maintained frontend install
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Frontend regression tests
        working-directory: frontend
        run: node --experimental-strip-types --test src/admin/*.test.mjs src/lib/*.test.mjs
      - name: Catalogue, social links and deployment root regressions
        working-directory: frontend
        run: npx playwright test scripts/catalogue.spec.mjs --workers=1
      - name: Production build and TypeScript
        working-directory: frontend
        run: npm run build
      - name: Install browser for audio integration
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser audio and CSP regression
        working-directory: frontend
        run: npm run test:ring:browser
      - name: Browser checkout return and kitchen workflows
        working-directory: frontend
        run: node --experimental-strip-types scripts/test-order-workflows.mjs
